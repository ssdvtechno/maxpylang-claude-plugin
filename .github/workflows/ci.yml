name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch breaking changes in MaxPyLang main

jobs:
  recipes:
    name: recipes (py${{ matrix.python }}, maxpylang ${{ matrix.maxpylang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        maxpylang: [pypi, github]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install MaxPyLang
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.maxpylang }}" = "pypi" ]; then
            pip install maxpylang
          else
            pip install "git+https://github.com/Barnard-PL-Labs/MaxPyLang.git"
          fi
          pip install matplotlib
      - name: Build, lint and render every recipe and example
        run: python tests/run_all.py --render

  audio:
    name: audio check (browser engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/Barnard-PL-Labs/MaxPyLang.git" playwright
          python -m playwright install --with-deps chromium
      - name: Patches that should make sound do
        run: python tests/run_all.py --audio

  plugin:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate with Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
      - name: Scripts run without third-party packages
        run: |
          python3 skills/maxpylang/scripts/maxref.py -c cycle~ live.dial live.observer
          python3 skills/maxpylang/scripts/inspect_patch.py examples/chorus.amxd --lint
          python3 skills/maxpylang/scripts/render_patch.py examples/arpeggiator.maxpat -o /tmp/arp.svg
